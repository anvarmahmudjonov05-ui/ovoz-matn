name: EXE yasash
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --noconfirm --onefile --noconsole --name OvozMatn
          --collect-all speech_recognition --collect-all sounddevice --collect-all _sounddevice_data
          ovoz_matn.py
      - uses: actions/upload-artifact@v4
        with:
          name: OvozMatn-exe
          path: dist/OvozMatn.exe
